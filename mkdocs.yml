site_name: 实验室计算平台用户手册
site_description: 实验室计算平台使用指南
site_author: Liancheng Wu
site_url: https://Willantern.github.io/lab-handbook/
repo_url: https://github.com/Willantern/lab-handbook
repo_name: Willantern/lab-handbook
edit_uri: edit/main/docs/
extra_css:
  - stylesheets/monochrome.css
theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 快速开始:
      - 概览: getting-started/index.md
      - SSH 登录: getting-started/ssh.md
      - 初始化环境: getting-started/environment.md
  - 集群使用:
      - 集群概览: cluster/overview.md
      - 用户信息: cluster/server-userinfo.md
      - Slurm: cluster/slurm.md
      - 提交作业: cluster/slurm-submit.md
      - 用户管理: cluster/slurm-users.md
      - 分区配置: cluster/slurm-partitions.md
      - QOS: cluster/slurm-qos.md
      - 磁盘配额: cluster/disk-quota.md
      - 端口占用: cluster/port-use.md
  - 软件环境:
      - Linux : software/linux.md
      - Lmod Modules: software/modules.md
      - Conda: software/conda.md
      - Apptainer: software/apptainer.md
  - 数据管理:
      - 共享数据集: data/shared-data.md
      - 软件包缓存(Python): data/devpi-pytorch-cache.md
      - 共享Pytorch: data/shared-pytorch.md
  # - 实验流程:
  #     - PyTorch GPU 作业: workflows/pytorch-gpu.md
  - 故障排查: troubleshooting/index.md
  - 实时监控: troubleshooting/monitoring-and-process-audit.md
  - 手册维护: contributing.md
